apiVersion: apps/v1
kind: Deployment
metadata:
  name: axionui-deployment
  labels:
    app: nginx4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx4
  template:
    metadata:
      labels:
        app: nginx4
    spec:
      containers:
      - name: axionui
        image: satishregistry001.azurecr.io/axion-ui:V3
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nxionui-service
spec:
  selector:
    app: nginx4
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
