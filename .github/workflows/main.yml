name: Deploy Application to AKS

on:
  push:
    branches:
      - main

# GitHub Actions ko Git repo me values.yaml update karke push karne ki permission
permissions:
  id-token: write
  contents: write

jobs:

  build-deploy:

    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:

      # ============================================================
      # 1. Checkout Source Code
      # ============================================================

      - name: Checkout Code
        uses: actions/checkout@v4

      # ============================================================
      # 2. Azure Login using OIDC
      # ============================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 0125ae9e-0326-45f3-8b95-bbf4719b7514
          tenant-id: 6f3dd6ca-22ac-4502-94be-48e8cb061c33
          subscription-id: 5deb291d-199b-4e8c-a522-d3f6f5f9c776

      # ============================================================
      # 3. Verify Azure Login
      # ============================================================

      - name: Check Azure Account
        run: |
          az account show

      # ============================================================
      # 4. Login to Azure Container Registry
      # ============================================================

      - name: Login to ACR
        run: |
          az acr login --name satishregistry001

      # ============================================================
      # 5. Check Docker
      # ============================================================

      - name: Check Docker
        run: |
          docker --version
          docker info

      # ============================================================
      # 6. Build Docker Image
      # Image Tag = GitHub Actions Run Number
      # Example: axion-ui:25
      # ============================================================

      - name: Build Docker Image
        run: |
          docker build \
            -t satishregistry001.azurecr.io/axion-ui:${{ github.run_number }} \
            .

      # ============================================================
      # 7. Push Docker Image to ACR
      # ============================================================

      - name: Push Image to ACR
        run: |
          docker push \
            satishregistry001.azurecr.io/axion-ui:${{ github.run_number }}

      # ============================================================
      # 8. Verify Image in ACR
      # ============================================================

      - name: Verify Image
        run: |
          az acr repository show-tags \
            --name satishregistry001 \
            --repository axion-ui \
            --output table

      # ============================================================
      # 9. Install yq
      # ============================================================

      - name: Install yq
        run: |

          if command -v yq >/dev/null 2>&1
          then
            echo "yq already installed"
          else
            echo "Installing yq..."

            sudo wget -qO /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64

            sudo chmod +x /usr/local/bin/yq
          fi

          yq --version

      # ============================================================
      # 10. Check values.yaml
      # ============================================================

      - name: Check values.yaml
        run: |
          echo "Current values.yaml:"
          cat values.yaml

      # ============================================================
      # 11. Update Image Tag in values.yaml
      # ============================================================

      - name: Update Image Tag
        run: |

          yq e \
            '.image.tag = "${{ github.run_number }}"' \
            -i values.yaml

          echo "Updated values.yaml:"
          cat values.yaml

      # ============================================================
      # 12. Check Git Difference
      # ============================================================

      - name: Check Git Changes
        run: |
          git status
          git diff -- values.yaml

      # ============================================================
      # 13. Commit Updated values.yaml
      # ============================================================

      - name: Commit Image Tag
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add values.yaml

          git commit \
            -m "Update axion-ui image tag to ${{ github.run_number }}" \
            || echo "No changes to commit"

      # ============================================================
      # 14. Push values.yaml Change
      # ============================================================

      - name: Push Git Changes
        run: |
          git push
