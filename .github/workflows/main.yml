name: Deploy Application to AKS

on:
  push:
    branches:
      - main
      
permissions:
  id-token: write
  contents: read
  
# env:
#   ACR_NAME: acrmicroservicesprod001
#   IMAGE_NAME: axion-ui
#   AKS_RESOURCE_GROUP: your-resource-group
#   AKS_CLUSTER_NAME: your-aks-cluster

jobs:
  build-deploy:

    runs-on:
       - self-hosted 
       - Linux 
       - X64

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 0125ae9e-0326-45f3-8b95-bbf4719b7514
          tenant-id: 6f3dd6ca-22ac-4502-94be-48e8cb061c33
          subscription-id: 5deb291d-199b-4e8c-a522-d3f6f5f9c776
          # creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check Azure Account
        run: |
          az account show
          
      - name: Login to ACR
        run: |
          az acr login --name satishregistry001

      - name: Build Docker Image
        run: |
          docker build -t satishregistry001.azurecr.io/axion-ui:V2 .

      - name: Push Image to ACR
        run: |
          docker push satishregistry001.azurecr.io/axion-ui:V2

